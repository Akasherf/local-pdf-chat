services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-pdf-chat-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    restart: unless-stopped

  app:
    build: .
    container_name: local-pdf-chat-app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - LLM_MODEL=llama3.1:8b
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: